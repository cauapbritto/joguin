# Gera o instalador .deb (Linux Mint / Ubuntu / Debian).
# Rode pela aba Actions ("Run workflow") ou crie uma tag v1.2.3: o .deb fica nos
# artefatos da execução e, nas tags, também anexado à release.
name: Pacote Linux (.deb)

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  deb:
    # Ubuntu 22.04 (glibc 2.35): o .deb roda no Linux Mint 21 e mais novos
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bibliotecas
        run: pip install -r requirements.txt pyinstaller
      - name: Testes
        run: python -m unittest discover tests
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
      - name: Gerar o .deb
        run: python tools/build_deb.py
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          SOULSTRIKE_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: soulstrike-deb
          path: dist/*.deb
      - name: Anexar à release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb
