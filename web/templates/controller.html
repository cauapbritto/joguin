<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d0b12">
<title>Soul Strike · Controle</title>
<link rel="stylesheet" href="{{ url_for('static', filename='controller.css', v=v) }}">
</head>
<body>

<!-- Escolha de vaga -->
<section id="view-join" class="view">
  <header class="brand">SOUL STRIKE</header>
  <p class="lead">Qual jogador é você?</p>
  <div class="slot-grid">
    <button class="slot" data-slot="1">1</button>
    <button class="slot" data-slot="2">2</button>
    <button class="slot" data-slot="3">3</button>
    <button class="slot" data-slot="4">4</button>
  </div>
  <p class="note" id="join-note">Use a mesma rede Wi-Fi do computador.</p>
</section>

<!-- Espera (menu, conexão, resultado) -->
<section id="view-wait" class="view">
  <div class="tag" data-bind="tag">P1</div>
  <h1 data-bind="wait-title">Conectado</h1>
  <p class="lead" data-bind="wait-text">Aguardando o anfitrião escolher o modo de jogo.</p>
  <div class="row" id="results-actions">
    <button class="btn" data-tap="up">▲</button>
    <button class="btn" data-tap="down">▼</button>
    <button class="btn btn-main" data-tap="confirm">OK</button>
  </div>
  <div class="row" id="story-actions">
    <button class="btn btn-main" data-tap="confirm">AVANÇAR ▶</button>
    <button class="btn" data-tap="pause">PULAR</button>
  </div>
  <button class="link" id="change-slot">trocar de jogador</button>
</section>

<!-- Seleção de personagem -->
<section id="view-select" class="view">
  <div class="select-head">
    <div class="tag" data-bind="tag">P1</div>
    <span class="muted" data-bind="mode">DUELO</span>
  </div>
  <div class="select-main">
    <div class="select-body">
      <button class="arrow" data-tap="char_left" aria-label="anterior">◀</button>
      <div class="portrait"><img id="portrait" alt=""></div>
      <button class="arrow" data-tap="char_right" aria-label="próximo">▶</button>
    </div>
    <div class="select-info">
      <h2 id="char-name">—</h2>
      <div class="stats" id="stats"></div>
      <p class="ability" id="ability"></p>
      <button class="btn weapon" data-tap="weapon" id="weapon">ARMA</button>
      <button class="btn btn-main" id="ready-btn" data-tap="confirm">PRONTO</button>
    </div>
  </div>
</section>

<!-- Campanha: escolha de melhoria no fim da fase -->
<section id="view-choose" class="view">
  <div class="select-head">
    <div class="tag" data-bind="tag">P1</div>
    <span class="muted">ESCOLHA UMA MELHORIA</span>
  </div>
  <div class="choose-list">
    <button class="opt" data-tap="opt1"><b></b><span></span></button>
    <button class="opt" data-tap="opt2"><b></b><span></span></button>
    <button class="opt" data-tap="opt3"><b></b><span></span></button>
  </div>
  <button class="btn btn-main" id="choose-ok" data-tap="confirm">CONFIRMAR</button>
</section>

<!-- Controle -->
<section id="view-pad" class="view">
  <div class="pad-top">
    <div class="tag" data-bind="tag">P1</div>
    <span class="muted" data-bind="mode">DUELO</span>
    <span class="souls" id="souls" title="suas almas"><b>◆</b><span id="souls-n">0</span><em id="souls-gain"></em></span>
    <span class="net" id="net" title="qualidade da conexão">● --</span>
    <button class="btn small" data-tap="pause">II</button>
  </div>
  <div id="stick-zone">
    <div id="stick-base">
      <div id="stick-stamina"></div>
      <div id="stick-knob"></div>
    </div>
    <span class="hint" id="pad-hint">mova o analógico</span>
  </div>
  <!-- Botões em arco em volta do polegar direito. O toque vale para o botão mais
       próximo (não precisa acertar em cheio) e dá para deslizar de um para outro. -->
  <div id="btn-zone">
    <div class="pad-set battle-only">
      <button class="pb pb-main" data-act="attack" data-pos="main">ATACAR</button>
      <button class="pb" data-act="special" data-pos="w">HABILIDADE</button>
      <button class="pb" data-act="switch" data-pos="nw">TROCAR ARMA</button>
      <button class="pb" data-act="dodge" data-pos="n">ESQUIVA</button>
      <i id="ammo-badge"></i>
    </div>
    <div class="pad-set soccer-only">
      <button class="pb pb-main" data-act="attack" data-pos="main">CHUTAR</button>
      <button class="pb" data-act="special" data-pos="w">PASSE</button>
      <button class="pb pb-mark" data-act="mark" data-pos="nw">MARCAR</button>
      <button class="pb" data-act="dodge" data-pos="n">CORTE</button>
      <button class="pb pb-small" data-act="dribble" data-pos="ww">COLADO</button>
      <button class="pb pb-small pb-super" data-act="super" data-pos="nn" id="super-btn"><span id="super-label">SUPER</span></button>
    </div>
  </div>
  <!-- fim de fase da campanha: todos confirmam para ir para a próxima fase -->
  <button class="btn btn-main" id="vote-btn" data-tap="confirm">TELETRANSPORTE DE FASE</button>
  <div id="paused">PAUSADO</div>
</section>

<div id="rotate">Gire o celular para jogar deitado</div>
<div id="offline">Sem conexão com o jogo…</div>

<script src="{{ url_for('static', filename='controller.js', v=v) }}"></script>
</body>
</html>
